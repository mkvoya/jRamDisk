name: macOS Build

on:
  push:
    branches: [trunk, main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Universal macOS app and DMG
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Show toolchain
        run: xcodebuild -version

      - name: Run safety regression tests
        run: bash scripts/test.sh

      - name: Build Release for Apple Silicon and Intel
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild build \
            -project jRamDisk.xcodeproj \
            -scheme jRamDisk \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Build.xcresult \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            | tee build/xcodebuild.log

      - name: Verify and ad-hoc sign app
        run: |
          set -euo pipefail
          app='build/DerivedData/Build/Products/Release/jRamDisk.app'
          test -d "$app"
          for arch in arm64 x86_64; do
            lipo "$app/Contents/MacOS/jRamDisk" -verify_arch "$arch"
          done
          plutil -lint "$app/Contents/Info.plist"
          # No Apple certificate or secrets required. This is not notarization.
          codesign --force --sign - --timestamp=none "$app"
          codesign --verify --strict --verbose=2 "$app"

      - name: Create DMG and checksum
        run: |
          set -euo pipefail
          mkdir -p build/dmg-root dist
          ditto build/DerivedData/Build/Products/Release/jRamDisk.app build/dmg-root/jRamDisk.app
          ln -s /Applications build/dmg-root/Applications
          hdiutil create -volname jRamDisk -srcfolder build/dmg-root \
            -format UDZO dist/jRamDisk-macOS-Universal.dmg
          hdiutil verify dist/jRamDisk-macOS-Universal.dmg
          cd dist
          shasum -a 256 jRamDisk-macOS-Universal.dmg > jRamDisk-macOS-Universal.dmg.sha256

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: jRamDisk-macOS-Universal
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jRamDisk-build-diagnostics
          path: |
            build/xcodebuild.log
            build/Build.xcresult
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Publish tagged release
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: jRamDisk-macOS-Universal
          path: dist

      - name: Publish DMG and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          dmg='jRamDisk-macOS-Universal.dmg'
          checksum="${dmg}.sha256"
          test -s "$dmg"
          test -s "$checksum"
          sha256sum --check "$checksum"

          # Resume interrupted drafts, but never replace a published release.
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" == 'false' ]]; then
              assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
              grep -Fxq "$dmg" <<< "$assets"
              grep -Fxq "$checksum" <<< "$assets"
              echo "Release $RELEASE_TAG already contains both assets; nothing to publish."
              exit 0
            fi
          else
            notes="$RUNNER_TEMP/release-notes.txt"
            cat > "$notes" <<'EOF'
          Download `jRamDisk-macOS-Universal.dmg` below. Supports Apple Silicon and Intel Macs running macOS 13 or later.

          Open the DMG and drag jRamDisk into Applications. The accompanying `.sha256` file can be used to verify the download.

          This build is ad-hoc signed, not Developer ID signed or notarized; macOS Gatekeeper may block it.

          Upgrade note: disks created by older versions are not automatically adopted. Their data is untouched. Save any needed files before ejecting them in Disk Utility and recreating them in this version.
          EOF
            prerelease=false
            if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=true; fi
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "jRamDisk $RELEASE_TAG" --generate-notes --notes-file "$notes" \
              --prerelease="$prerelease"
          fi

          gh release upload "$RELEASE_TAG" "$dmg" "$checksum" --clobber
          # Publish only after both assets have uploaded successfully.
          gh release edit "$RELEASE_TAG" --draft=false

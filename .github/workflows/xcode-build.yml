name: macOS Build

on:
  push:
    branches: [trunk, main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Universal macOS app and DMG
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Show toolchain
        run: xcodebuild -version

      - name: Run safety regression tests
        run: bash scripts/test.sh

      - name: Build Release for Apple Silicon and Intel
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild build \
            -project jRamDisk.xcodeproj \
            -scheme jRamDisk \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/Build.xcresult \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            | tee build/xcodebuild.log

      - name: Verify and ad-hoc sign app
        run: |
          set -euo pipefail
          app='build/DerivedData/Build/Products/Release/jRamDisk.app'
          test -d "$app"
          for arch in arm64 x86_64; do
            lipo "$app/Contents/MacOS/jRamDisk" -verify_arch "$arch"
          done
          plutil -lint "$app/Contents/Info.plist"
          # No Apple certificate or secrets required. This is not notarization.
          codesign --force --sign - --timestamp=none "$app"
          codesign --verify --strict --verbose=2 "$app"

      - name: Create DMG and checksum
        run: |
          set -euo pipefail
          mkdir -p build/dmg-root dist
          ditto build/DerivedData/Build/Products/Release/jRamDisk.app build/dmg-root/jRamDisk.app
          ln -s /Applications build/dmg-root/Applications
          hdiutil create -volname jRamDisk -srcfolder build/dmg-root \
            -format UDZO dist/jRamDisk-macOS-Universal.dmg
          hdiutil verify dist/jRamDisk-macOS-Universal.dmg
          cd dist
          shasum -a 256 jRamDisk-macOS-Universal.dmg > jRamDisk-macOS-Universal.dmg.sha256

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: jRamDisk-macOS-Universal
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jRamDisk-build-diagnostics
          path: |
            build/xcodebuild.log
            build/Build.xcresult
          if-no-files-found: warn
          retention-days: 7
